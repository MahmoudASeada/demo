<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Answers</title>

<style>
body{
  font-family:Arial;
  background:#f6f7fb;
  padding:30px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:15px;
  margin-bottom:15px;
}

.question{
  font-weight:bold;
  margin-bottom:10px;
}

.answer{
  margin-bottom:12px;
  color:#101828;
}

.download-file{
  display:inline-block;
  background:#101828;
  color:#fff;
  padding:9px 14px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  font-size:13px;
}

.btn{
  color:white;
  border:none;
  padding:12px 18px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  margin-bottom:25px;
}
</style>

</head>
<body>

<h1>Survey Answers</h1>

<button onclick="downloadWord()" class="btn" style="background:#c9000b;">
  Download Word
</button>

<button onclick="downloadExcel()" class="btn" style="background:#101828;margin-left:10px;">
  Download Excel
</button>

<div id="answers"></div>

<script>
const id = new URLSearchParams(location.search).get("id");
const adminToken = localStorage.getItem("admin_token");

if(!adminToken){
  window.location.href = "admin-login.html";
}

let responseAnswers = [];

fetch("api/response-details.php?id=" + id)
.then(r => r.json())
.then(data => {

  responseAnswers = data.answers || [];

  let html = "";

  responseAnswers.forEach(item => {

    const fileButton = item.file_id
      ? `
        <a class="download-file"
          href="api/download-survey-file.php?id=${item.file_id}&token=${encodeURIComponent(adminToken)}">
          Download File: ${item.file_name}
        </a>
      `
      : "";

    html += `
      <div class="card">
        <div class="question">
          ${item.question_text}
        </div>

        <div class="answer">
          ${item.answer || ""}
        </div>

        ${fileButton}
      </div>
    `;
  });

  document.getElementById("answers").innerHTML = html;

});

function downloadWord(){

  if(!responseAnswers.length){
    alert("No answers to download");
    return;
  }

  let content = `
    <html>
    <head>
      <meta charset="UTF-8">
      <title>Survey Answers</title>
      <style>
        body{font-family:Arial;line-height:1.6;}
        h1{color:#c9000b;}
        .answer-box{
          border:1px solid #ddd;
          padding:15px;
          margin-bottom:15px;
          border-radius:10px;
        }
        .question{font-weight:bold;margin-bottom:8px;}
      </style>
    </head>
    <body>
      <h1>Survey Answers</h1>
  `;

  responseAnswers.forEach(item => {
    content += `
      <div class="answer-box">
        <div class="question">${item.question_text}</div>
        <div>${item.answer || ""}</div>
        ${item.file_name ? `<div>Attached File: ${item.file_name}</div>` : ""}
      </div>
    `;
  });

  content += `
    </body>
    </html>
  `;

  const blob = new Blob([content], {
    type: "application/msword"
  });

  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "survey-answers.doc";
  link.click();

  URL.revokeObjectURL(link.href);
}

function downloadExcel(){

  if(!responseAnswers.length){
    alert("No answers to download");
    return;
  }

  let csv = "Question,Answer,Attached File\n";

  responseAnswers.forEach(item => {
    const question = `"${String(item.question_text || "").replace(/"/g,'""')}"`;
    const answer = `"${String(item.answer || "").replace(/"/g,'""')}"`;
    const file = `"${String(item.file_name || "").replace(/"/g,'""')}"`;

    csv += `${question},${answer},${file}\n`;
  });

  const blob = new Blob([csv], {
    type:"text/csv;charset=utf-8;"
  });

  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "survey-answers.csv";
  link.click();

  URL.revokeObjectURL(link.href);
}
</script>

</body>
</html>
