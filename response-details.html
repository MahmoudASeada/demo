<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Answers</title>

<style>
body{
  font-family:Arial;
  background:#f6f7fb;
  padding:30px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:15px;
  margin-bottom:15px;
}

.question{
  font-weight:bold;
  margin-bottom:10px;
}
</style>

</head>
<body>

<h1>Survey Answers</h1>

<div id="answers"></div>

<script>

const id =
new URLSearchParams(location.search).get("id");

fetch(
  "api/response-details.php?id="+id
)
.then(r=>r.json())
.then(data=>{

  let html = "";

  data.answers.forEach(item=>{

    html += `
      <div class="card">

        <div class="question">
          ${item.question_text}
        </div>

        <div>
          ${item.answer}
        </div>

      </div>
    `;
  });

  document.getElementById("answers").innerHTML = html;

});
</script>

</body>
</html>
