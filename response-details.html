body{
  background:#f6f7fb;

  padding:35px;

.logo{color:#c9000b;font-size:24px;font-weight:800}
.logout{border:none;background:#c9000b;color:#fff;padding:12px 18px;border-radius:10px;font-weight:800;cursor:pointer}

.nav{
  margin-bottom:28px;
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  background:#ffffff;
  padding:8px;
  border-radius:16px;
  box-shadow:0 4px 20px rgba(0,0,0,0.04);
  border:1px solid #eaecf0;
}

.nav a{
  background:transparent;
  color:#475467;
  padding:10px 18px;
  border-radius:10px;
  text-decoration:none;
  font-weight:700;
  font-size:14px;
  transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  display:inline-flex;
  align-items:center;
  gap:8px;
}

.nav a:hover{
  background:#f8fafc;
  color:#101828;
  transform:translateY(-1px);
}

.nav a.active{
  background:linear-gradient(135deg, #c9000b 0%, #a30008 100%);
  color:#ffffff;
  box-shadow:0 4px 14px rgba(201, 0, 11, 0.28);
}

.card{
  background:#fff;
  padding:20px;
  border-radius:15px;
  margin-bottom:15px;
}

.question{
  font-weight:bold;
  margin-bottom:10px;
}

.answer{
  margin-bottom:12px;
  color:#101828;
}

.download-file{
  display:inline-block;
  background:#101828;
  color:#fff;
  padding:9px 14px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  font-size:13px;
}

.btn{
  color:white;
  border:none;
  padding:12px 18px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  margin-bottom:25px;
}
</style>

</head>

    Responses

  <a href="sources-files.html">

<h1 style="margin-bottom:20px;font-size:24px;">Survey Answers</h1>

<button onclick="downloadWord()" class="btn" style="background:#c9000b;">
  Download Word
</button>

<button onclick="downloadExcel()" class="btn" style="background:#101828;margin-left:10px;">
  Download Excel
</button>

<div id="answers"></div>

<script>
const id = new URLSearchParams(location.search).get("id");
let adminToken = localStorage.getItem("admin_token");
let adminUser = JSON.parse(localStorage.getItem("admin_user") || "{}");

if(!adminToken || !adminUser.role){
  window.location.href = "admin-login.html";
}

function logoutAdmin(){
  localStorage.removeItem("admin_token");
  localStorage.removeItem("admin_user");
  window.location.href = "admin-login.html";
}

if(adminUser.role !== "super_admin"){
  const usersLink = document.getElementById("usersManagementLink");
  const articlesLink = document.getElementById("articlesAssignmentLink");

  if(usersLink) usersLink.style.display = "none";
  if(articlesLink) articlesLink.style.display = "none";
}

let responseAnswers = [];

fetch("api/response-details.php?id=" + id)
.then(r => r.json())
.then(data => {

  responseAnswers = data.answers || [];

  let html = "";

  responseAnswers.forEach(item => {

    const fileButton = item.file_id
      ? `
        <a class="download-file"
          href="api/download-survey-file.php?id=${item.file_id}&token=${encodeURIComponent(adminToken)}">
          Download File: ${item.file_name}
        </a>
      `
      : "";

    html += `
      <div class="card">
        <div class="question">
          ${item.question_text}
        </div>

        <div class="answer">
          ${item.answer || ""}
        </div>

        ${fileButton}
      </div>
    `;
  });

  document.getElementById("answers").innerHTML = html;

});

function downloadWord(){

  if(!responseAnswers.length){
    alert("No answers to download");
    return;
  }

  let content = `
    <html>
    <head>
      <meta charset="UTF-8">
      <title>Survey Answers</title>
      <style>
        body{font-family:Arial;line-height:1.6;}
        h1{color:#c9000b;}
        .answer-box{
          border:1px solid #ddd;
          padding:15px;
          margin-bottom:15px;
          border-radius:10px;
        }
        .question{font-weight:bold;margin-bottom:8px;}
      </style>
    </head>
    <body>
      <h1>Survey Answers</h1>
  `;

  responseAnswers.forEach(item => {
    content += `
      <div class="answer-box">
        <div class="question">${item.question_text}</div>
        <div>${item.answer || ""}</div>
        ${item.file_name ? `<div>Attached File: ${item.file_name}</div>` : ""}
      </div>
    `;
  });

  content += `
    </body>
    </html>
  `;

  const blob = new Blob([content], {
    type: "application/msword"
  });

  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "survey-answers.doc";
  link.click();

  URL.revokeObjectURL(link.href);
}

function downloadExcel(){

  if(!responseAnswers.length){
    alert("No answers to download");
    return;
  }

  let csv = "Question,Answer,Attached File\n";

  responseAnswers.forEach(item => {
    const question = `"${String(item.question_text || "").replace(/"/g,'""')}"`;
    const answer = `"${String(item.answer || "").replace(/"/g,'""')}"`;
    const file = `"${String(item.file_name || "").replace(/"/g,'""')}"`;

    csv += `${question},${answer},${file}\n`;
  });

  const blob = new Blob([csv], {
    type:"text/csv;charset=utf-8;"
  });

  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "survey-answers.csv";
  link.click();

  URL.revokeObjectURL(link.href);
}
</script>

</body>
</html>
