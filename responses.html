<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Survey Responses</title>

<style>
body{
  font-family:Arial;
  background:#f6f7fb;
  padding:30px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.back{
  color:#c9000b;
  font-weight:bold;
  text-decoration:none;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:15px;
  margin-bottom:15px;
  box-shadow:0 5px 15px rgba(0,0,0,.05);
}

h2{
  margin-bottom:10px;
}

a{
  color:#c9000b;
  font-weight:bold;
}

.empty{
  background:#fff;
  padding:25px;
  border-radius:15px;
  color:#667085;
}
</style>
</head>

<body>

<div class="top">
  <h1 id="pageTitle">Survey Responses</h1>
  <a href="admin.html" class="back">← Back to Admin</a>
</div>

<div id="responses">
  <div class="empty">Loading responses...</div>
</div>

<script>
const adminToken = localStorage.getItem("admin_token");

if(!adminToken){
  window.location.href = "admin-login.html";
}

const params = new URLSearchParams(window.location.search);
const surveyId = params.get("survey_id");

async function loadResponses(){

  const box = document.getElementById("responses");

  const apiUrl = surveyId
    ? "api/admin-responses.php?survey_id=" + surveyId
    : "api/admin-responses.php";

  try{
    const res = await fetch(apiUrl,{
      headers:{
        Authorization:"Bearer " + adminToken
      }
    });

    const data = await res.json();

    if(!data.success){
      box.innerHTML = `<div class="empty">${data.message || "Unable to load responses."}</div>`;
      return;
    }

    if(!data.responses.length){
      box.innerHTML = `<div class="empty">No responses found.</div>`;
      return;
    }

    if(surveyId){
      document.getElementById("pageTitle").innerText = "Survey Responses #" + surveyId;
    }

    box.innerHTML = data.responses.map(item => `
      <div class="card">

        <h2>${item.title || item.survey_title || "Survey"}</h2>

        <p>
          <b>User:</b>
          ${item.name}
        </p>

        <p>
          <b>Email:</b>
          ${item.email}
        </p>

        <p>
          <b>Date:</b>
          ${item.submitted_at}
        </p>

        <a href="response-details.html?id=${item.id}">
          View Answers
        </a>

      </div>
    `).join("");

  }catch(error){
    box.innerHTML = `<div class="empty">Connection error.</div>`;
  }
}

loadResponses();
</script>

</body>
</html>
