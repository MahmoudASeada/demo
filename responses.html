<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Survey Responses</title>

<style>
body{
  font-family:Arial;
  background:#f6f7fb;
  padding:30px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:15px;
  margin-bottom:15px;
  box-shadow:0 5px 15px rgba(0,0,0,.05);
}

h2{
  margin-bottom:10px;
}

a{
  color:#c9000b;
  font-weight:bold;
}
</style>

</head>
<body>

<h1>Survey Responses</h1>

<div id="responses"></div>

<script>

fetch("api/admin-responses.php",{
  headers:{
    Authorization:"Bearer admin123"
  }
})
.then(r=>r.json())
.then(data=>{

  let html = "";

  data.responses.forEach(item=>{

    html += `
      <div class="card">

        <h2>${item.title}</h2>

        <p>
          <b>User:</b>
          ${item.name}
        </p>

        <p>
          <b>Email:</b>
          ${item.email}
        </p>

        <p>
          <b>Date:</b>
          ${item.submitted_at}
        </p>

        <a href="response-details.html?id=${item.id}">
          View Answers
        </a>

      </div>
    `;
  });

  document.getElementById("responses").innerHTML = html;

});
</script>

</body>
</html>
