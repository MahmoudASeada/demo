<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}

body{
  margin:0;
  min-height:100vh;
  background:#f6f7fb;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:24px;
  padding:34px;
  box-shadow:0 14px 35px rgba(0,0,0,.08);
}

.logo{
  color:#c9000b;
  font-weight:800;
  font-size:24px;
  margin-bottom:10px;
}

h1{
  margin-bottom:24px;
  color:#101828;
}

label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:8px;
}

input{
  width:100%;
  height:54px;
  border:1px solid #dfe3ea;
  background:#f1f3f6;
  border-radius:12px;
  padding:0 15px;
  margin-bottom:18px;
  outline:none;
}

button{
  width:100%;
  height:56px;
  border:none;
  background:#c9000b;
  color:#fff;
  border-radius:12px;
  font-weight:800;
  cursor:pointer;
}

.status{
  margin-top:14px;
  text-align:center;
  color:#c9000b;
  font-size:13px;
}
</style>
</head>

<body>

<div class="card">
  <div class="logo">W zone</div>
  <h1>Admin Login</h1>

  <label>Email</label>
  <input type="email" id="email" placeholder="admin@wzone.com">

  <label>Password</label>
  <input type="password" id="password" placeholder="Password">

  <button onclick="loginAdmin()">Login</button>

  <div class="status" id="status"></div>
</div>

<script>
async function loginAdmin(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const status = document.getElementById("status");

  status.innerText = "Please wait...";

  try{
    const res = await fetch("api/admin-login.php",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        email,
        password
      })
    });

    const data = await res.json();

    if(!data.success){
      status.innerText = data.message;
      return;
    }

    localStorage.setItem("admin_token", data.token);
    localStorage.setItem("admin_user", JSON.stringify(data.admin));
    window.location.href = "admin.html";

  }catch(error){
    status.innerText = "Connection error";
  }
}
</script>

</body>
</html>
