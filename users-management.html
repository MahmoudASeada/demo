<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin - Users Management</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{background:#f6f7fb;color:#101828;padding:35px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.logo{color:#c9000b;font-size:24px;font-weight:800}.logout{border:none;background:#c9000b;color:#fff;padding:12px 18px;border-radius:10px;font-weight:800;cursor:pointer}.nav{margin-bottom:25px;display:flex;gap:12px;flex-wrap:wrap}.nav a{background:#101828;color:#fff;padding:12px 18px;border-radius:10px;text-decoration:none;font-weight:800}.nav a.active{background:#c9000b}.panel{background:#fff;border-radius:20px;box-shadow:0 14px 35px rgba(0,0,0,.06);overflow:hidden}.panel-head{padding:24px 28px;border-bottom:1px solid #eef1f5}.panel-head h1{font-size:24px;margin-bottom:6px}.panel-head p{color:#667085;font-size:14px}table{width:100%;border-collapse:collapse}th{text-align:left;background:#f8fafc;padding:14px 24px;color:#667085;font-size:12px}td{padding:15px 24px;border-top:1px solid #eef1f5;font-size:13px}.badge{padding:6px 12px;border-radius:20px;font-size:11px;font-weight:800}.approved{background:#e8faef;color:#20a95a}.pending{background:#fff3e5;color:#d97706}.actions{display:flex;gap:8px}.btn{border:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:800;font-size:12px}.approve-btn{background:#c9000b;color:#fff}.reject-btn{background:#20a95a;color:#fff}.empty{padding:30px;text-align:center;color:#667085}@media(max-width:800px){body{padding:18px}table{min-width:760px}.panel{overflow-x:auto}}
.assignment-box{
  padding:24px;
}

.assignment-box label{
  display:block;
  font-size:15px;
  font-weight:800;
  margin-bottom:10px;
}

.assignment-box select{
  width:100%;
  height:56px;
  border:1px solid #dfe3ea;
  background:#f8fafc;
  border-radius:14px;
  padding:0 18px;
  font-size:15px;
  outline:none;
}

.assignment-box select:focus{
  border-color:#c9000b;
  box-shadow:0 0 0 4px rgba(201,0,11,.08);
}
</style></head><body>
<div class="topbar"><div class="logo">W zone Admin</div><button class="logout" onclick="logoutAdmin()">Logout</button></div>
<div class="nav"><a href="admin.html">Surveys</a><a href="responses.html">Responses</a><a href="articles-assignment.html">Articles Assignment</a><a href="users-management.html" id="usersManagementLink" style="background:#101828;color:#fff;padding:12px 18px;border-radius:10px;text-decoration:none;font-weight:800;">
  Users Management
</a>
<a href="sources-files.html">
  Sources & Files
</a>
<a href="settings.html">Settings</a>
</div>
<div class="panel"><div class="panel-head"><h1>Users Management</h1><p>Approve or reject new registered users.</p></div><table><thead><tr><th>ID</th><th>User</th><th>Email</th><th>Status</th><th>Created At</th><th>Actions</th></tr></thead><tbody id="usersTable"><tr><td colspan="6" class="empty">Loading users...</td></tr></tbody></table></div>
<div class="panel" style="margin-top:28px;">
  <div class="panel-head">
    <h1>SEO Admin Assignments</h1>
    <p>Choose which users each SEO admin can manage.</p>
  </div>

  <div class="assignment-box">
    <label>Select SEO Admin</label>
    <select id="seoAdminSelect" onchange="renderSeoUserAssignments()">
      <option value="">Loading SEO admins...</option>
    </select>

    <div id="seoUsersList" style="margin-top:20px;"></div>

    <button class="approve-btn btn" onclick="saveSeoAssignments()" style="margin-top:20px;padding:12px 18px;">
      Save Assignments
    </button>

    <div id="assignmentStatus" style="margin-top:12px;color:#667085;"></div>
  </div>
</div>
<script>
const adminToken = localStorage.getItem("admin_token");

if(!adminToken){
  window.location.href = "admin-login.html";
}

const adminUser = JSON.parse(localStorage.getItem("admin_user") || "{}");

if(adminUser.role !== "super_admin"){
  alert("You are not allowed to access this page.");
  window.location.href = "admin.html";
}

function logoutAdmin(){
  localStorage.removeItem("admin_token");
  localStorage.removeItem("admin_user");
  window.location.href = "admin-login.html";
}

async function loadUsers(){
  const table = document.getElementById("usersTable");

  try{
    const res = await fetch("api/admin-users.php",{
      headers:{
        Authorization:"Bearer " + adminToken
      }
    });

    const data = await res.json();

    if(!data.success){
      localStorage.removeItem("admin_token");
      localStorage.removeItem("admin_user");
      window.location.href = "admin-login.html";
      return;
    }

    if(!data.users.length){
      table.innerHTML = `
        <tr>
          <td colspan="6" class="empty">No users found.</td>
        </tr>
      `;
      return;
    }

    table.innerHTML = data.users.map(user => {
      const approved = Number(user.approved) === 1;

      return `
        <tr>
          <td>#${user.id}</td>
          <td>${user.name}</td>
          <td>${user.email}</td>
          <td>
            <span class="badge ${approved ? "approved" : "pending"}">
              ${approved ? "Approved" : "Pending"}
            </span>
          </td>
          <td>${user.created_at}</td>
          <td>
            <div class="actions">
              ${
                approved
                ? `<button class="btn approve-btn" disabled>Approved</button>`
                : `<button class="btn approve-btn" onclick="updateUser(${user.id}, 'approve')">Approve</button>`
              }
              <button class="btn reject-btn" onclick="updateUser(${user.id}, 'reject')">Reject</button>
            </div>
          </td>
        </tr>
      `;
    }).join("");

  }catch(error){
    table.innerHTML = `
      <tr>
        <td colspan="6" class="empty">Connection error.</td>
      </tr>
    `;
  }
}

async function updateUser(userId, action){
  if(action === "reject"){
    const ok = confirm("Are you sure you want to reject and delete this user?");
    if(!ok) return;
  }

  try{
    const res = await fetch("api/admin-users.php",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        Authorization:"Bearer " + adminToken
      },
      body:JSON.stringify({
        userId,
        action
      })
    });

    const data = await res.json();

    alert(data.message);
    loadUsers();

  }catch(error){
    alert("Connection error");
  }
}
let seoAdmins = [];
let approvedUsers = [];
let seoAssignments = {};

async function loadSeoAssignments(){
  const select = document.getElementById("seoAdminSelect");

  try{
    const res = await fetch("api/admin-user-assignments.php",{
      headers:{
        Authorization:"Bearer " + adminToken
      }
    });

    const data = await res.json();

    if(!data.success){
      select.innerHTML = `<option value="">Unable to load SEO admins</option>`;
      return;
    }

    seoAdmins = data.seoAdmins || [];
    approvedUsers = data.users || [];
    seoAssignments = data.assignments || {};

    if(!seoAdmins.length){
      select.innerHTML = `<option value="">No SEO admins found</option>`;
      return;
    }

    select.innerHTML = `
      <option value="">Select SEO Admin</option>
      ${seoAdmins.map(admin => `
        <option value="${admin.id}">${admin.name} - ${admin.email}</option>
      `).join("")}
    `;

  }catch(error){
    select.innerHTML = `<option value="">Connection error</option>`;
  }
}

function renderSeoUserAssignments(){
  const adminId = document.getElementById("seoAdminSelect").value;
  const box = document.getElementById("seoUsersList");

  if(!adminId){
    box.innerHTML = "";
    return;
  }

  const assigned = seoAssignments[adminId] || [];

  box.innerHTML = approvedUsers.map(user => `
    <label style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      border:1px solid #eef1f5;
      border-radius:12px;
      padding:12px 16px;
      margin-bottom:10px;
      background:#fff;
    ">
      <div>
        <strong>${user.name}</strong><br>
        <span style="color:#667085;font-size:12px;">${user.email}</span>
      </div>

      <input 
        type="checkbox" 
        value="${user.id}"
        ${assigned.includes(Number(user.id)) ? "checked" : ""}
        style="width:18px;height:18px;"
      >
    </label>
  `).join("");
}

async function saveSeoAssignments(){
  const adminId = document.getElementById("seoAdminSelect").value;
  const status = document.getElementById("assignmentStatus");

  if(!adminId){
    status.innerText = "Please select SEO admin.";
    return;
  }

  const userIds = Array.from(
    document.querySelectorAll("#seoUsersList input[type='checkbox']:checked")
  ).map(input => input.value);

  status.innerText = "Saving...";

  try{
    const res = await fetch("api/admin-user-assignments.php",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        Authorization:"Bearer " + adminToken
      },
      body:JSON.stringify({
        adminId,
        userIds
      })
    });

    const data = await res.json();
    status.innerText = data.message;

    if(data.success){
      seoAssignments[adminId] = userIds.map(id => Number(id));
    }

  }catch(error){
    status.innerText = "Connection error.";
  }
}
loadUsers();
loadSeoAssignments();
</script>
</body></html>
