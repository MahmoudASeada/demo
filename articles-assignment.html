<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin - Articles Assignment</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{background:#f6f7fb;color:#101828;padding:35px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.logo{color:#c9000b;font-size:24px;font-weight:800}.logout{border:none;background:#c9000b;color:#fff;padding:12px 18px;border-radius:10px;font-weight:800;cursor:pointer}.nav{margin-bottom:25px;display:flex;gap:12px;flex-wrap:wrap}.nav a{background:#101828;color:#fff;padding:12px 18px;border-radius:10px;text-decoration:none;font-weight:800}.nav a.active{background:#c9000b}.panel{background:#fff;border-radius:20px;box-shadow:0 14px 35px rgba(0,0,0,.06);overflow:hidden}.panel-head{padding:24px 28px;border-bottom:1px solid #eef1f5}.panel-head h1{font-size:24px;margin-bottom:6px}.panel-head p{color:#667085;font-size:14px}.article-admin-card{border:1px solid #eef1f5;border-radius:16px;padding:18px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:20px}.article-admin-card h3{font-size:18px;margin-bottom:6px}.article-admin-card p{color:#667085;font-size:13px}.article-count{background:#f8fafc;border-radius:20px;padding:8px 14px;font-size:13px;font-weight:800;color:#475467;margin-right:10px}.manage-btn,.save-assign{border:none;background:#c9000b;color:#fff;padding:12px 18px;border-radius:10px;font-weight:800;cursor:pointer}.assign-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:99999;padding:20px}.assign-modal.show{display:flex}.assign-box{width:100%;max-width:620px;max-height:82vh;overflow:auto;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.18)}.assign-head{padding:22px 24px;border-bottom:1px solid #eef1f5;display:flex;justify-content:space-between;align-items:center}.assign-head button{width:34px;height:34px;border-radius:50%;border:none;background:#c9000b;color:#fff;font-size:20px;cursor:pointer}.assign-body{padding:22px 24px}.user-search{width:100%;height:44px;border:1px solid #dfe3ea;border-radius:12px;padding:0 14px;outline:none;margin-bottom:16px}.assign-user{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px 16px;border:1px solid #eef1f5;border-radius:12px;margin-bottom:10px}.assign-user-info{flex:1}.assign-user strong{display:block;font-size:14px}.assign-user span{font-size:12px;color:#667085;word-break:break-word}.assign-user input[type="checkbox"]{width:18px;height:18px;flex-shrink:0}.assign-footer{padding:18px 24px 30px;border-top:1px solid #eef1f5;display:flex;justify-content:flex-end;align-items:center;gap:12px}
</style></head><body>
<div class="topbar"><div class="logo">W zone Admin</div><button class="logout" onclick="logoutAdmin()">Logout</button></div>
<div class="nav"><a href="admin.html">Surveys</a><a href="responses.html">Responses</a><a class="active" href="articles-assignment.html">Articles Assignment</a><a href="users-management.html" id="usersManagementLink" style="background:#101828;color:#fff;padding:12px 18px;border-radius:10px;text-decoration:none;font-weight:800;">
  Users Management
</a></div>
<div class="panel"><div class="panel-head"><h1>Articles Assignment</h1><p>Select which users can see each article.</p></div><div id="articlesAssignment" style="padding:24px;">Loading articles...</div></div>
<script>
const adminToken = localStorage.getItem("admin_token"); if(!adminToken){window.location.href="admin-login.html";}const adminUser = JSON.parse(localStorage.getItem("admin_user") || "{}");

if(adminUser.role !== "super_admin"){
  alert("You are not allowed to access this page.");
  window.location.href = "admin.html";

}function logoutAdmin(){
  localStorage.removeItem("admin_token");
  localStorage.removeItem("admin_user");
  window.location.href="admin-login.html";
}
let adminArticles=[], adminUsers=[], adminAssignments={}, currentArticleId=null;
async function loadAdminArticles(){const box=document.getElementById("articlesAssignment");try{const res=await fetch("api/admin-articles.php");const data=await res.json();if(!data.success){box.innerHTML="Failed to load articles.";return;}adminArticles=data.articles||[];adminUsers=data.users||[];adminAssignments=data.assignments||{};if(!adminArticles.length){box.innerHTML="No articles found in Sanity.";return;}box.innerHTML=adminArticles.map(article=>{const assigned=adminAssignments[article._id]||[];return `<div class="article-admin-card"><div><h3>${article.title}</h3><p>${article.category||"Article"} · ${article.publishedDate||""}</p></div><div><span class="article-count">${assigned.length} Users</span><button class="manage-btn" onclick="openAssignModal('${article._id}')">Manage Users</button></div></div>`}).join("");}catch(e){box.innerHTML="Connection error.";}}
function openAssignModal(articleId){currentArticleId=articleId;const article=adminArticles.find(a=>a._id===articleId);const assigned=adminAssignments[articleId]||[];document.getElementById("assignTitle").innerText=article.title;document.getElementById("assignMeta").innerText=`${article.category||"Article"} · ${article.publishedDate||""}`;document.getElementById("assignSearch").value="";document.getElementById("assignStatus").innerText="";renderAssignUsers(adminUsers,assigned);document.getElementById("assignModal").classList.add("show");}
function closeAssignModal(){document.getElementById("assignModal").classList.remove("show");}
function renderAssignUsers(users,assigned){const list=document.getElementById("assignUsersList");if(!users.length){list.innerHTML="No users found.";return;}list.innerHTML=users.map(user=>`<label class="assign-user"><div class="assign-user-info"><strong>${user.name}</strong><span>${user.email}</span></div><input type="checkbox" value="${user.id}" ${assigned.includes(Number(user.id))?"checked":""}></label>`).join("");}
function filterAssignUsers(){const value=document.getElementById("assignSearch").value.toLowerCase().trim();const assigned=adminAssignments[currentArticleId]||[];const filtered=adminUsers.filter(user=>(user.name||"").toLowerCase().includes(value)||(user.email||"").toLowerCase().includes(value));renderAssignUsers(filtered,assigned);}
async function saveCurrentArticleUsers(){const status=document.getElementById("assignStatus");const userIds=Array.from(document.querySelectorAll("#assignUsersList input[type='checkbox']:checked")).map(input=>input.value);status.innerText="Saving...";try{const res=await fetch("api/admin-articles.php",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({articleId:currentArticleId,userIds})});const data=await res.json();status.innerText=data.message;if(data.success){adminAssignments[currentArticleId]=userIds.map(id=>Number(id));loadAdminArticles();setTimeout(()=>closeAssignModal(),700);}}catch(e){status.innerText="Connection error.";}}
loadAdminArticles();
</script>
<div class="assign-modal" id="assignModal"><div class="assign-box"><div class="assign-head"><div><h2 id="assignTitle">Assign Users</h2><p id="assignMeta" style="color:#667085;font-size:13px;margin-top:5px;"></p></div><button onclick="closeAssignModal()">×</button></div><div class="assign-body"><input type="text" class="user-search" id="assignSearch" placeholder="Search users..." oninput="filterAssignUsers()"><div id="assignUsersList"></div></div><div class="assign-footer"><span id="assignStatus"></span><button class="save-assign" onclick="saveCurrentArticleUsers()">Save Users</button></div></div></div>
</body></html>
