<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sources & Files</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f6f7fb;color:#101828;padding:35px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
.logo{color:#c9000b;font-size:24px;font-weight:800}
.logout,.primary{border:none;background:#c9000b;color:#fff;padding:12px 18px;border-radius:10px;font-weight:800;cursor:pointer}
.nav{margin-bottom:28px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;background:#ffffff;padding:8px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.04);border:1px solid #eaecf0}
.nav a{background:transparent;color:#475467;padding:10px 18px;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px;transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1);display:inline-flex;align-items:center;gap:8px}
.nav a:hover{background:#f8fafc;color:#101828;transform:translateY(-1px)}
.nav a.active{background:linear-gradient(135deg, #c9000b 0%, #a30008 100%);color:#ffffff;box-shadow:0 4px 14px rgba(201, 0, 11, 0.28)}
.panel{background:#fff;border-radius:20px;box-shadow:0 14px 35px rgba(0,0,0,.06);margin-bottom:28px;overflow:hidden;}
.panel-head{padding:24px 28px;border-bottom:1px solid #eef1f5;}
.panel-head h1{font-size:24px;margin-bottom:6px;}
.panel-head p{color:#667085;font-size:14px;}
.panel-body{padding:28px;}
input{width:100%;border:1px solid #dfe3ea;background:#f8fafc;border-radius:12px;padding:13px 14px;margin:10px 0 15px}
.folder{border:1px solid #eef1f5;border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer}
.folder.active{border-color:#c9000b;background:#fff5f5}
.file{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eef1f5;padding:14px 0;gap:12px}
.btn{border:none;padding:8px 12px;border-radius:8px;font-weight:800;cursor:pointer}
.download{background:#101828;color:#fff}
.delete{background:#c9000b;color:#fff}
.small{color:#667085;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.assigned-badge{
    display:inline-block;
    margin-top:8px;
    padding:5px 12px;
    border-radius:20px;
    background:#e9f9ef;
    color:#17803d;
    font-size:12px;
    font-weight:700;
    border:1px solid #b8e7c8;
}

.local-badge{
    display:inline-block;
    margin-top:8px;
    padding:5px 12px;
    border-radius:20px;
    background:#f3f4f6;
    color:#6b7280;
    font-size:12px;
    font-weight:700;
    border:1px solid #d1d5db;
}
.assigned-email{
    display:block;
    margin-top:3px;
    font-size:11px;
    font-weight:400;
    color:#4b5563;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="logo">W zone Admin</div>
  <button class="logout" onclick="logoutAdmin()">Logout</button>
</div>

<div class="nav">
  <a href="admin.html">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    Surveys
  </a>
  <a href="responses.html">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    Responses
  </a>
  <a href="articles-assignment.html" id="articlesAssignmentLink">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    Articles Assignment
  </a>
  <a href="users-management.html" id="usersManagementLink">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    Users Management
  </a>
  <a href="sources-files.html" class="active">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
    Sources & Files
  </a>
  <a href="admin-calendar.html">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Calendar
  </a>
  <a href="settings.html">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    Settings
  </a>
</div>

<div class="panel">
  <div class="panel-head">
    <h1>Sources & Files</h1>
    <p>Create folders and upload files. Each admin can only see their own files.</p>
  </div>
  <div class="panel-body">
    <h2 style="margin-bottom:12px;">Create Folder / Source</h2>
    <input type="text" id="folderTitle" placeholder="Example: Client Documents">
    <button class="primary" onclick="createFolder()">Create Folder</button>
    <div id="folderStatus" class="small" style="margin-top:8px;"></div>
  </div>
</div>

<div class="panel">
  <div class="panel-body">
    <h2 style="margin-bottom:15px;">Your Folders</h2>
    <div id="foldersBox">Loading folders...</div>
  </div>
</div>

<div class="panel" id="filesPanel" style="display:none;">
  <div class="panel-body">
    <h2 id="currentFolderTitle">Files</h2>

    <input type="file" id="fileInput" multiple>

    <label style="display:block;margin-top:15px;font-weight:bold">
    Send To User (Optional)
    </label>

    <select id="selectedUser" style="
    width:100%;
    padding:12px;
    border:1px solid #dfe3ea;
    border-radius:12px;
    margin:10px 0 15px;
    background:#f8fafc;
    ">
        <option value="">Only Upload (Don't Send)</option>
    </select>

    <button class="primary" onclick="uploadFiles()">Upload Files</button>

    <div id="uploadStatus" class="small"></div>
    <div id="filesBox" style="margin-top:20px;"></div>
  </div>
</div>

<script>
let adminToken = localStorage.getItem("admin_token");
let adminUser = JSON.parse(localStorage.getItem("admin_user") || "{}");

if(!adminToken || !adminUser.role){
  window.location.href = "admin-login.html";
}

document.body.style.display="none";
checkPassword();

if(adminUser.role !== "super_admin"){
  const articlesLink = document.getElementById("articlesAssignmentLink");
  const usersLink = document.getElementById("usersManagementLink");

  if(articlesLink) articlesLink.style.display = "none";
  if(usersLink) usersLink.style.display = "none";
}

let folders = [];
let currentFolderId = null;
let users = [];

function logoutAdmin(){
  localStorage.removeItem("admin_token");
  localStorage.removeItem("admin_user");
  window.location.href = "admin-login.html";
}

async function loadFolders(){
  const box = document.getElementById("foldersBox");

  try{
    const res = await fetch("api/source-folders.php",{
      headers:{
        Authorization:"Bearer " + adminToken
      }
    });

    const data = await res.json();

    if(!data.success){
      box.innerHTML = data.message || "Failed to load folders.";
      return;
    }

    folders = data.folders || [];

    if(!folders.length){
      box.innerHTML = `<div class="small">No folders yet.</div>`;
      return;
    }

    box.innerHTML = folders.map(folder => `
      <div class="folder" id="folder-${folder.id}" onclick="openFolder(${folder.id})">
        <strong>${folder.title}</strong>
        <div class="small">${folder.created_at}</div>
      </div>
    `).join("");

  }catch(error){
    box.innerHTML = "Connection error.";
  }
}

async function createFolder(){
  const titleInput = document.getElementById("folderTitle");
  const status = document.getElementById("folderStatus");
  const title = titleInput.value.trim();

  if(!title){
    status.innerText = "Please enter folder title.";
    return;
  }

  status.innerText = "Creating...";

  try{
    const res = await fetch("api/source-folders.php",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        Authorization:"Bearer " + adminToken
      },
      body:JSON.stringify({title})
    });

    const data = await res.json();
    status.innerText = data.message;

    if(data.success){
      titleInput.value = "";
      loadFolders();
    }

  }catch(error){
    status.innerText = "Connection error.";
  }
}

async function openFolder(folderId){
  currentFolderId = folderId;

  document.querySelectorAll(".folder").forEach(el => {
    el.classList.remove("active");
  });

  const folderEl = document.getElementById("folder-" + folderId);
  if(folderEl){
    folderEl.classList.add("active");
  }

  const folder = folders.find(f => Number(f.id) === Number(folderId));
  document.getElementById("currentFolderTitle").innerText = folder ? folder.title : "Files";
  document.getElementById("filesPanel").style.display = "block";

  await loadFiles();
}

async function loadFiles(){
  const box = document.getElementById("filesBox");

  if(!currentFolderId){
    box.innerHTML = "";
    return;
  }

  box.innerHTML = "Loading files...";

  try{
    const res = await fetch("api/source-files.php?folder_id=" + currentFolderId,{
      headers:{
        Authorization:"Bearer " + adminToken
      }
    });

    const data = await res.json();

    if(!data.success){
      box.innerHTML = data.message || "Failed to load files.";
      return;
    }

    const files = data.files || [];

    if(!files.length){
      box.innerHTML = `<div class="small">No files uploaded yet.</div>`;
      return;
    }

    box.innerHTML = files.map(file => `
      <div class="file">
        <div>
    <strong>${file.original_name}</strong>

    <div class="small">
        ${(Number(file.file_size || 0) / 1024).toFixed(1)}
        KB · ${file.uploaded_at}
    </div>

    ${
        file.assigned_user_name
        ?
        `
        <div class="assigned-badge">
    🟢 Assigned to ${file.assigned_user_name}
    <br>
    <span class="assigned-email">
        ${file.assigned_user_email}
    </span>
</div>
        `
        :
        `
        <div class="local-badge">
            ⚪ Not Assigned
        </div>
        `
    }
</div>

        <div class="actions">
          <button class="btn download" onclick="downloadFile(${file.id})">Download</button>
          <button class="btn delete" onclick="deleteFile(${file.id})">Delete</button>
        </div>
      </div>
    `).join("");

  }catch(error){
    box.innerHTML = "Connection error.";
  }
}

async function uploadFiles(){
  const input = document.getElementById("fileInput");
  const status = document.getElementById("uploadStatus");

  if(!currentFolderId){
    status.innerText = "Please select folder first.";
    return;
  }

  if(!input.files.length){
    status.innerText = "Please choose files.";
    return;
  }

  const formData = new FormData();
  formData.append("folder_id", currentFolderId);
  const selectedUser = document.getElementById("selectedUser").value;

if(selectedUser){
    formData.append("user_id", selectedUser);
}

  Array.from(input.files).forEach(file => {
    formData.append("files[]", file);
  });

  status.innerText = "Uploading...";

  try{
    const res = await fetch("api/source-files.php",{
      method:"POST",
      headers:{
        Authorization:"Bearer " + adminToken
      },
      body:formData
    });

    const data = await res.json();
    status.innerText = data.message;

    if(data.success){
      input.value = "";
      loadFiles();
    }

  }catch(error){
    status.innerText = "Connection error.";
  }
}

function downloadFile(fileId){
  window.location.href =
    "api/download-source-file.php?id=" + fileId +
    "&token=" + encodeURIComponent(adminToken);
}

async function deleteFile(fileId){
  const ok = confirm("Delete this file?");
  if(!ok) return;

  try{
    const res = await fetch("api/source-files.php?id=" + fileId,{
      method:"DELETE",
      headers:{
        Authorization:"Bearer " + adminToken
      }
    });

    const data = await res.json();
    alert(data.message);

    if(data.success){
      loadFiles();
    }

  }catch(error){
    alert("Connection error.");
  }
}
async function loadUsers(){

  const select = document.getElementById("selectedUser");

  try{

    const res = await fetch("api/admin-users.php",{
      headers:{
        Authorization:"Bearer " + adminToken
      }
    });

    const data = await res.json();

    if(!data.success) return;

    users = data.users || [];

    users.forEach(user=>{

      if(Number(user.approved)!==1) return;

      select.innerHTML += `
        <option value="${user.id}">
          ${user.name} (${user.email})
        </option>
      `;

    });

  }catch(err){
    console.log(err);
  }

}
async function checkPassword(){

    const res = await fetch("api/settings.php",{
        headers:{
            Authorization:"Bearer "+adminToken
        }
    });

    const data = await res.json();

    if(!data.hasPassword){
        document.body.style.display="block";
        return;
    }

    while(true){

        const pass = prompt("Enter Sources & Files Password");

        if(pass===null){
            location.href="admin.html";
            return;
        }

        const verify = await fetch("api/settings.php",{

            method:"POST",

            headers:{
                Authorization:"Bearer "+adminToken,
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                action:"verify",
                password:pass
            })

        });

        const result = await verify.json();

        if(result.success){
            document.body.style.display="block";
            break;
        }

        alert("Wrong Password");

    }

}
loadUsers();
loadFolders();
</script>

</body>
</html>
