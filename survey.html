<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survey</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

body{
  background:#f6f7fb;
  color:#101828;
  min-height:100vh;
  padding:40px 20px;
}

.container{
  width:100%;
  max-width:760px;
  margin:auto;
}

.back{
  display:inline-block;
  margin-bottom:20px;
  color:#c9000b;
  font-weight:800;
  text-decoration:none;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:34px;
  box-shadow:0 14px 35px rgba(0,0,0,.06);
}

h1{
  font-size:28px;
  margin-bottom:8px;
}

.subtitle{
  color:#667085;
  margin-bottom:28px;
}

.field{
  margin-bottom:22px;
}

label{
  display:block;
  font-size:14px;
  font-weight:800;
  margin-bottom:9px;
}

.required{
  color:#c9000b;
}

input,textarea{
  width:100%;
  border:1px solid #dfe3ea;
  background:#f8fafc;
  border-radius:14px;
  padding:14px 16px;
  outline:none;
  font-size:14px;
}

textarea{
  min-height:115px;
  resize:vertical;
}

input:focus,textarea:focus{
  border-color:#c9000b;
  box-shadow:0 0 0 3px rgba(201,0,11,.08);
}

.error-field{
  border-color:#c9000b!important;
}

.status{
  margin-top:15px;
  color:#667085;
  font-size:14px;
}

.status.error{
  color:#c9000b;
  font-weight:800;
}

.submit{
  width:100%;
  height:56px;
  border:none;
  background:#c9000b;
  color:#fff;
  border-radius:14px;
  font-weight:800;
  font-size:16px;
  cursor:pointer;
  margin-top:15px;
}

.submit:hover{
  background:#b00009;
}

.completed{
  background:#e8faef;
  color:#20a95a;
  padding:14px;
  border-radius:14px;
  font-weight:800;
  margin-bottom:20px;
}
.input-area{
  position:relative;
}

input,textarea{
  padding-left:50px;
}

.mic-btn{
  position:absolute;
  left:14px;
  top:14px;
  border:none;
  background:transparent;
  width:22px;
  height:22px;
  cursor:pointer;
  font-size:18px;
  color:#111;
}

.mic-btn.recording{
  color:#c9000b;
  animation:pulse 1s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.18);}
  100%{transform:scale(1);}
}
.question-chips{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:12px;
}

.chip-btn{
  border:none;
  background:#eef1f5;
  color:#101828;
  padding:8px 14px;
  border-radius:20px;
  cursor:pointer;
  font-size:13px;
  font-weight:700;
}

.chip-btn:hover{
  background:#dfe3ea;
}
.confirm-box{
  margin:20px 0;
  display:flex;
  align-items:center;
}

.confirm-box label{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:16px;
  color:#667085;
  cursor:pointer;
}

.confirm-box input[type="checkbox"]{
  width:22px;
  height:22px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

  <a href="dashboard.html" class="back">← Back to Dashboard</a>

  <div class="card">

    <div id="completedBox"></div>

    <h1 id="surveyTitle">Loading...</h1>
    <p class="subtitle" id="surveyMeta">Please answer all required questions.</p>

    <div id="questionsWrap"></div>
    <div class="confirm-box">
      <label>
        <input type="checkbox" id="confirmSubmit">
        I have reviewed all questions before submitting this form.
      </label>
    </div>
    <button class="submit" id="submitBtn" onclick="submitSurvey()">
      Submit Survey
    </button>

    <div class="status" id="status"></div>

  </div>

</div>

<script>
const token = localStorage.getItem("portal_token");

if(!token){
  window.location.href = "login.html";
}

const params = new URLSearchParams(window.location.search);
const surveyId = params.get("id");

if(!surveyId){
  alert("Survey ID missing");
  window.location.href = "dashboard.html";
}

let loadedQuestions = [];
let recognition;
let isRecording = false;
let currentButton = null;
const STORAGE_KEY = "survey_answers_" + surveyId;

function saveToLocalStorage(){
  const data = {};

  document
    .querySelectorAll("#questionsWrap input, #questionsWrap textarea")
    .forEach(field => {
      data[field.dataset.questionId] = field.value;
    });

  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function loadFromLocalStorage(){
  const saved = localStorage.getItem(STORAGE_KEY);

  if(!saved) return;

  const data = JSON.parse(saved);

  Object.keys(data).forEach(key => {
    const field = document.querySelector(`[data-question-id="${key}"]`);

    if(field){
      field.value = data[key];
    }
  });
}
async function loadSurvey(){

  const status = document.getElementById("status");

  try{

    const res = await fetch("api/survey-details.php?id=" + surveyId,{
      headers:{
        Authorization:"Bearer " + token
      }
    });

    const data = await res.json();

    if(!data.success){
      status.classList.add("error");
      status.innerText = data.message;
      return;
    }

    document.getElementById("surveyTitle").innerText = data.survey.title;
    document.getElementById("surveyMeta").innerText =
      "Status: " + data.survey.status + " | Created: " + data.survey.created_at;

    loadedQuestions = data.questions;
    window.loadedAnswers = data.answers || [];
    if(data.survey.status === "completed"){
      document.getElementById("completedBox").innerHTML =
        `<div class="completed">This survey has already been submitted.</div>`;

      document.getElementById("submitBtn").style.display = "none";
    }

    renderQuestions();
    loadFromLocalStorage();
  }catch(error){

    status.classList.add("error");
    status.innerText = "Connection error";

  }
}

function renderQuestions(){

  const wrap = document.getElementById("questionsWrap");

  if(!loadedQuestions.length){
    wrap.innerHTML = `<p>No questions found.</p>`;
    return;
  }

  const isCompleted = document.getElementById("submitBtn").style.display === "none";

  if(isCompleted){
    wrap.innerHTML = loadedQuestions.map(q => {

      const answerObj = (window.loadedAnswers || []).find(a => Number(a.question_id) === Number(q.id));
      const answerText = answerObj ? answerObj.answer : "No answer found";

      return `
        <div class="field">
          <label>${q.question_text}</label>

          <div style="
            background:#f8fafc;
            border:1px solid #dfe3ea;
            border-radius:14px;
            padding:16px;
            font-size:14px;
            color:#101828;
            line-height:1.6;
          ">
            ${answerText}
          </div>
        </div>
      `;
    }).join("");

    return;
  }

  wrap.innerHTML = loadedQuestions.map(q => {

    const required = Number(q.required) === 1;

    let inputHTML = "";
    let chips = [];

    try{
      chips = q.chips ? JSON.parse(q.chips) : [];
    }catch(e){
      chips = [];
    }

    const chipsHTML = chips.map(chip => `
      <button
        class="chip-btn"
        type="button"
        onclick="insertChip('${q.id}', '${chip.replace(/'/g, "\\'")}')"
      >
        ${chip}
      </button>
    `).join("");

    if(q.question_type === "file"){
      inputHTML = `
        <input
          type="file"
          data-question-id="${q.id}"
          data-question-label="${q.question_text}"
          data-required="${required ? "1" : "0"}"
          data-max-size="${q.max_file_size_mb || ""}"
          required
          style="padding-left:16px;"
        >
        ${
          q.max_file_size_mb
          ? `<div style="font-size:12px;color:#667085;margin-top:6px;">Max file size: ${q.max_file_size_mb} MB</div>`
          : ""
        }
      `;
    }else if(q.question_type === "textarea"){
      inputHTML = `
        <textarea
          data-question-id="${q.id}"
          data-question-label="${q.question_text}"
          data-required="${required ? "1" : "0"}"
          placeholder="Type your answer here..."
          required
        ></textarea>
      `;
    }else{
      inputHTML = `
        <input
          type="text"
          data-question-id="${q.id}"
          data-question-label="${q.question_text}"
          data-required="${required ? "1" : "0"}"
          placeholder="Type your answer here..."
          required
        >
      `;
    }

    return `
      <div class="field">
        <label>
          ${q.question_text}
          ${required ? `<span class="required-star">*</span>` : ""}
        </label>

        <div class="input-area">
          ${inputHTML}
          ${
            q.question_type !== "file"
            ? `<button class="mic-btn" type="button" onclick="toggleVoice('${q.id}', this)">🎙</button>`
            : ""
          }
        </div>

        ${
          q.question_type !== "file" && chipsHTML
          ? `<div class="question-chips">${chipsHTML}</div>`
          : ""
        }
      </div>
    `;
  }).join("");

  document
    .querySelectorAll("#questionsWrap input, #questionsWrap textarea")
    .forEach(field => {
      field.addEventListener("input", function(){
        field.classList.remove("error-field");
        saveToLocalStorage();
      });

      field.addEventListener("change", function(){
        field.classList.remove("error-field");
        saveToLocalStorage();
      });
    });
}
function toggleVoice(fieldId, button){

  if(isRecording){
    stopVoice();
    return;
  }

  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    alert("Use Google Chrome");
    return;
  }

  const field = document.querySelector(`[data-question-id="${fieldId}"]`);

  if(!field){
    alert("Field not found");
    return;
  }

  recognition = new SpeechRecognition();

  recognition.lang = "en-US";
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  let finalTranscript = field.value || "";

  recognition.start();

  isRecording = true;
  currentButton = button;

  button.innerHTML = "⏹";
  button.classList.add("recording");

  document.getElementById("status").classList.remove("error");
  document.getElementById("status").innerText = "🎤 Listening...";

  recognition.onresult = function(event){

    let interimTranscript = "";

    for(let i = event.resultIndex; i < event.results.length; i++){

      let transcript = event.results[i][0].transcript;

      if(event.results[i].isFinal){
        finalTranscript += transcript + " ";
      }else{
        interimTranscript += transcript;
      }
    }

    field.value = finalTranscript + interimTranscript;
    field.classList.remove("field-error");
    saveToLocalStorage();
  };

  recognition.onend = function(){
    resetButton();
  };

  recognition.onerror = function(event){
    console.log("Speech error:", event.error);
    resetButton();
  };
}

function stopVoice(){
  if(recognition){
    recognition.stop();
  }

  resetButton();
}

function resetButton(){
  isRecording = false;

  if(currentButton){
    currentButton.innerHTML = "🎙";
    currentButton.classList.remove("recording");
  }

  document.getElementById("status").innerText = "Ready";
}

function validateSurvey(){

  const fields = document.querySelectorAll("#questionsWrap input, #questionsWrap textarea");
  let valid = true;

  fields.forEach(field => {
    field.classList.remove("error-field");

    const required = field.dataset.required === "1";

    if(required){
      if(field.type === "file"){
        if(!field.files.length){
          field.classList.add("error-field");
          valid = false;
          return;
        }

        const maxMb = Number(field.dataset.maxSize || 0);

        if(maxMb && field.files[0].size > maxMb * 1024 * 1024){
          field.classList.add("error-field");
          alert("File is too large. Max size is " + maxMb + " MB");
          valid = false;
          return;
        }

      }else if(field.value.trim() === ""){
        field.classList.add("error-field");
        valid = false;
      }
    }
  });

  return valid;
}
async function submitSurvey(){

  const status = document.getElementById("status");
  status.classList.remove("error");

  const confirmSubmit =
  document.getElementById("confirmSubmit");

  if(!confirmSubmit.checked){
    status.classList.add("error");
    status.innerText =
    "Please confirm that you reviewed all questions.";
    return;
  }

  if(!validateSurvey()){
    status.classList.add("error");
    status.innerText =
    "Please answer all required questions.";
    return;
  }

  const fields = document.querySelectorAll(
    "#questionsWrap input, #questionsWrap textarea"
  );

  const answers = [];
  const formData = new FormData();

  formData.append("surveyId", surveyId);

  fields.forEach(field => {

    if(field.type === "file"){

      if(field.files.length){
        formData.append(
          "files[" + field.dataset.questionId + "]",
          field.files[0]
        );
      }

      answers.push({
        questionId: field.dataset.questionId,
        questionLabel: field.dataset.questionLabel,
        answer: field.files.length
          ? field.files[0].name
          : ""
      });

    }else{

      answers.push({
        questionId: field.dataset.questionId,
        questionLabel: field.dataset.questionLabel,
        answer: field.value.trim()
      });

    }

  });

  formData.append(
    "answers",
    JSON.stringify(answers)
  );

  status.innerText = "Submitting...";

  try{

    const res = await fetch(
      "api/submit-survey.php",
      {
        method:"POST",
        headers:{
          Authorization:"Bearer " + token
        },
        body:formData
      }
    );

    const data = await res.json();

    status.innerText = data.message;

    if(data.success){

      localStorage.removeItem(STORAGE_KEY);

      alert(
        "Survey submitted successfully"
      );

      window.location.href =
      "dashboard.html";

    }else{

      status.classList.add("error");

    }

  }catch(error){

    status.classList.add("error");
    status.innerText = "Connection error";

  }
}
loadSurvey();
</script>

</body>
</html>
