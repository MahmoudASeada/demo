<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survey</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;}

body{
  margin:0;
  background:#fff;
  min-height:100vh;
  padding:28px 18px;
  color:#0f172a;
}

.container{
  width:100%;
  max-width:520px;
  margin:auto;
  background:white;
}

.back{
  display:inline-block;
  margin-bottom:18px;
  color:#c9000b;
  font-weight:800;
  text-decoration:none;
  font-size:13px;
}

h1{
  text-align:center;
  font-size:24px;
  margin:0 0 10px;
  font-weight:800;
  color:#0f172a;
}

.subtitle{
  text-align:center;
  font-size:12px;
  color:#475569;
  margin-bottom:34px;
  line-height:1.5;
}

.progress{
  width:100%;
  height:4px;
  background:#f1dfe2;
  border-radius:10px;
  margin-bottom:30px;
  overflow:hidden;
}

.progress span{
  display:block;
  width:33%;
  height:100%;
  background:#c9000b;
  border-radius:10px;
}

.field{
  margin-bottom:24px;
}

label{
  display:block;
  margin-bottom:8px;
  font-weight:700;
  font-size:12px;
  color:#111;
}

.required-star{
  color:#c9000b;
}

.input-area{
  position:relative;
  width:100%;
}

input,textarea{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:14px;
  padding:15px 15px 15px 50px;
  font-size:13px;
  outline:none;
  background:#fff;
  color:#0f172a;
  direction:auto;
  resize:none;
}

input{
  height:54px;
}

textarea{
  min-height:110px;
  padding-top:16px;
}

input:focus,textarea:focus{
  border-color:#c9000b;
  box-shadow:0 0 0 3px rgba(201,0,11,0.08);
}

.field-error{
  border-color:#c9000b!important;
  box-shadow:0 0 0 3px rgba(201,0,11,0.08);
}

.mic-btn{
  position:absolute;
  left:14px;
  top:14px;
  border:none;
  background:transparent;
  width:22px;
  height:22px;
  cursor:pointer;
  font-size:18px;
  color:#111;
}

.mic-btn.recording{
  color:#c9000b;
  animation:pulse 1s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.18);}
  100%{transform:scale(1);}
}

.status{
  margin-top:8px;
  color:#64748b;
  font-size:12px;
  min-height:18px;
}

.status.error{
  color:#c9000b;
  font-weight:700;
}

.submit-btn{
  width:100%;
  padding:17px;
  border:none;
  border-radius:16px;
  background:#c9000b;
  color:white;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
  margin-top:30px;
  box-shadow:0 12px 22px rgba(201,0,11,0.28);
}

.submit-btn:hover{
  background:#b00009;
}

.completed{
  background:#e8faef;
  color:#20a95a;
  padding:14px;
  border-radius:14px;
  font-weight:800;
  margin-bottom:20px;
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">

  <a href="dashboard.html" class="back">← Back to Dashboard</a>

  <h1 id="surveyTitle">Loading...</h1>

  <p class="subtitle" id="surveyMeta">
    Please answer all required questions.
  </p>

  <div class="progress">
    <span></span>
  </div>

  <div id="completedBox"></div>

  <div id="questionsWrap"></div>

  <div class="status" id="status">Loading questions...</div>

  <button class="submit-btn" id="submitBtn" onclick="submitSurvey()">
    Submit Feedback ▷
  </button>

</div>

<script>
const token = localStorage.getItem("portal_token");

if(!token){
  window.location.href = "login.html";
}

const params = new URLSearchParams(window.location.search);
const surveyId = params.get("id");

if(!surveyId){
  alert("Survey ID missing");
  window.location.href = "dashboard.html";
}

const STORAGE_KEY = "survey_answers_" + surveyId;

let loadedQuestions = [];
let recognition;
let isRecording = false;
let currentButton = null;

function saveToLocalStorage(){
  const data = {};

  document
    .querySelectorAll("#questionsWrap input, #questionsWrap textarea")
    .forEach(field => {
      data[field.dataset.questionId] = field.value;
    });

  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function loadFromLocalStorage(){
  const saved = localStorage.getItem(STORAGE_KEY);

  if(!saved) return;

  const data = JSON.parse(saved);

  Object.keys(data).forEach(key => {
    const field = document.querySelector(`[data-question-id="${key}"]`);

    if(field){
      field.value = data[key];
    }
  });
}

async function loadSurvey(){

  const status = document.getElementById("status");

  try{

    const res = await fetch("api/survey-details.php?id=" + surveyId,{
      headers:{
        Authorization:"Bearer " + token
      }
    });

    const data = await res.json();

    if(!data.success){
      status.classList.add("error");
      status.innerText = data.message;
      return;
    }

    document.getElementById("surveyTitle").innerText = data.survey.title;

    document.getElementById("surveyMeta").innerText =
      "Status: " + data.survey.status + " | Created: " + data.survey.created_at;

    loadedQuestions = data.questions;

    if(data.survey.status === "completed"){
      document.getElementById("completedBox").innerHTML =
        `<div class="completed">This survey has already been submitted.</div>`;

      document.getElementById("submitBtn").style.display = "none";
    }

    renderQuestions();
    loadFromLocalStorage();

    status.classList.remove("error");
    status.innerText = "Ready";

  }catch(error){

    status.classList.add("error");
    status.innerText = "Connection error";

  }
}

function renderQuestions(){

  const wrap = document.getElementById("questionsWrap");

  if(!loadedQuestions.length){
    wrap.innerHTML = `<p>No questions found.</p>`;
    return;
  }

  wrap.innerHTML = loadedQuestions.map(q => {

    const required = Number(q.required) === 1;

    let inputHTML = "";

    if(q.question_type === "textarea"){
      inputHTML = `
        <textarea
          data-question-id="${q.id}"
          data-question-label="${q.question_text}"
          data-required="${required ? "1" : "0"}"
          placeholder="Type your answer here..."
          required
        ></textarea>
      `;
    }else{
      inputHTML = `
        <input
          type="text"
          data-question-id="${q.id}"
          data-question-label="${q.question_text}"
          data-required="${required ? "1" : "0"}"
          placeholder="Type your answer here..."
          required
        >
      `;
    }

    return `
      <div class="field">
        <label>
          ${q.question_text}
          ${required ? `<span class="required-star">*</span>` : ""}
        </label>

        <div class="input-area">
          ${inputHTML}
          <button class="mic-btn" type="button" onclick="toggleVoice('${q.id}', this)">🎙</button>
        </div>
      </div>
    `;
  }).join("");

  document
    .querySelectorAll("#questionsWrap input, #questionsWrap textarea")
    .forEach(field => {
      field.addEventListener("input", function(){
        field.classList.remove("field-error");
        saveToLocalStorage();
      });
    });
}

function toggleVoice(fieldId, button){

  if(isRecording){
    stopVoice();
    return;
  }

  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    alert("Use Google Chrome");
    return;
  }

  recognition = new SpeechRecognition();

  const field = document.querySelector(`[data-question-id="${fieldId}"]`);

  recognition.lang = "en-US";
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  let finalTranscript = field.value || "";

  recognition.start();

  isRecording = true;
  currentButton = button;

  button.innerHTML = "⏹";
  button.classList.add("recording");

  document.getElementById("status").classList.remove("error");
  document.getElementById("status").innerText = "🎤 Listening...";

  recognition.onresult = function(event){

    let interimTranscript = "";

    for(let i = event.resultIndex; i < event.results.length; i++){

      let transcript = event.results[i][0].transcript;

      if(event.results[i].isFinal){
        finalTranscript += transcript + " ";
      }else{
        interimTranscript += transcript;
      }
    }

    field.value = finalTranscript + interimTranscript;
    field.classList.remove("field-error");
    saveToLocalStorage();
  };

  recognition.onend = function(){
    resetButton();
  };

  recognition.onerror = function(){
    resetButton();
  };
}

function stopVoice(){
  if(recognition){
    recognition.stop();
  }

  resetButton();
}

function resetButton(){
  isRecording = false;

  if(currentButton){
    currentButton.innerHTML = "🎙";
    currentButton.classList.remove("recording");
  }

  document.getElementById("status").innerText = "Ready";
}

function validateSurvey(){

  const fields = document.querySelectorAll("#questionsWrap input, #questionsWrap textarea");
  let valid = true;
  let firstEmpty = null;

  fields.forEach(field => {

    const required = field.dataset.required === "1";

    if(required && field.value.trim() === ""){
      field.classList.add("field-error");
      valid = false;

      if(!firstEmpty){
        firstEmpty = field;
      }
    }else{
      field.classList.remove("field-error");
    }
  });

  if(!valid){
    const status = document.getElementById("status");
    status.classList.add("error");
    status.innerText = "Please answer all required questions.";

    if(firstEmpty){
      firstEmpty.focus();
    }
  }

  return valid;
}

async function submitSurvey(){

  const status = document.getElementById("status");
  status.classList.remove("error");

  if(!validateSurvey()){
    return;
  }

  const fields = document.querySelectorAll("#questionsWrap input, #questionsWrap textarea");

  const answers = Array.from(fields).map(field => {
    return {
      questionId: field.dataset.questionId,
      questionLabel: field.dataset.questionLabel,
      answer: field.value.trim()
    };
  });

  status.innerText = "Submitting...";

  try{

    const res = await fetch("api/submit-survey.php",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        Authorization:"Bearer " + token
      },
      body:JSON.stringify({
        surveyId,
        answers
      })
    });

    const data = await res.json();

    status.innerText = data.message;

    if(data.success){
      localStorage.removeItem(STORAGE_KEY);
      alert("Survey submitted successfully");
      window.location.href = "dashboard.html";
    }else{
      status.classList.add("error");
    }

  }catch(error){

    status.classList.add("error");
    status.innerText = "Connection error";
  }
}

loadSurvey();
</script>

</body>
</html>
