<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f6f7fb;
  color:#111827;
}

.app{
  display:flex;
  min-height:100vh;
}

.sidebar{
  width:245px;
  background:#fff;
  border-right:1px solid #eee;
  padding:26px 14px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
}

.logo{
  color:#c9000b;
  font-size:22px;
  font-weight:800;
  margin-bottom:30px;
  padding-left:6px;
}

.menu a{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 14px;
  border-radius:12px;
  color:#667085;
  text-decoration:none;
  font-size:14px;
  margin-bottom:8px;
}

.menu a.active{
  background:#c9000b;
  color:#fff;
}

.sidebar-bottom{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.logout{
  color:#c9000b;
  font-size:14px;
  cursor:pointer;
  display:flex;
  gap:8px;
  align-items:center;
}

.user-card{
  border:1px solid #c9000b;
  border-radius:12px;
  padding:10px;
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:36px;
  height:36px;
  background:#d7defc;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  color:#283593;
}

.user-info h4{
  font-size:13px;
}

.user-info p{
  font-size:11px;
  color:#667085;
}

.main{
  margin-left:245px;
  width:calc(100% - 245px);
}

.topbar{
  height:58px;
  background:#fff;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 34px;
}

.search{
  width:420px;
  height:36px;
  border:1px solid #dce1ea;
  background:#f8fafc;
  border-radius:20px;
  padding:0 18px;
  outline:none;
  font-size:13px;
}

.top-user{
  display:flex;
  align-items:center;
  gap:10px;
}

.top-user div{
  text-align:right;
}

.top-user h4{
  font-size:13px;
}

.top-user p{
  font-size:10px;
  color:#667085;
}

.content{
  padding:44px 44px;
}

.welcome{
  margin-bottom:28px;
}

.welcome h1{
  font-size:30px;
  margin-bottom:8px;
}

.welcome p{
  color:#667085;
  font-size:14px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:34px;
  margin-bottom:34px;
}

.stat-card{
  background:#fff;
  border-radius:14px;
  padding:24px;
  display:flex;
  align-items:center;
  gap:18px;
  box-shadow:0 14px 32px rgba(0,0,0,.04);
}

.stat-icon{
  width:48px;
  height:48px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff3f3;
  color:#c9000b;
  font-size:22px;
}

.stat-card:nth-child(2) .stat-icon{
  background:#f1f4ff;
  color:#6476d9;
}

.stat-card:nth-child(3) .stat-icon{
  background:#effaf3;
  color:#3bb66b;
}

.stat-card p{
  font-size:13px;
  color:#667085;
  margin-bottom:6px;
}

.stat-card h2{
  font-size:27px;
}

.panel{
  background:#fff;
  border-radius:20px;
  box-shadow:0 14px 32px rgba(0,0,0,.04);
  margin-bottom:34px;
  overflow:hidden;
}

.panel-head{
  padding:22px 26px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.panel-head h3{
  font-size:17px;
}

.panel-head a{
  color:#c9000b;
  font-size:13px;
  font-weight:700;
  text-decoration:none;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  text-align:left;
  background:#f8fafc;
  padding:14px 26px;
  color:#667085;
  font-size:12px;
  font-weight:700;
}

td{
  padding:16px 26px;
  border-top:1px solid #edf0f5;
  font-size
